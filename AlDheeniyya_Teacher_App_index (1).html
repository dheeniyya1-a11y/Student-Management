<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10263d"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Al-Dheeniyya Class Teacher (Online)</title>
<style>
:root{--bg:#f3f6f5;--card:#fff;--text:#25343c;--muted:#66767f;--line:#dfe8e4;--navy:#10263d;--green:#147a58;--gb:#e5f3ed;--red:#b43d48;--rb:#f8e7e8;--amb:#fbefd9;--am:#8f5a06;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a24;--card:#16252f;--text:#e4ece8;--muted:#9bb0a8;--line:#27404b;--green:#35b987;--gb:#173a2f;--red:#e0707a;--rb:#3a1c20;--amb:#3a2f14;--am:#f0c36a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 84px}
button,input,select,textarea{font:inherit;color:inherit}.hidden{display:none!important}.muted{color:var(--muted)}small{font-size:13px}
.hd{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:14px 16px}.hd img{width:44px;height:44px;border-radius:50%;background:#fff}.hd b{display:block}.hd small{color:#bfd0d8}.hd .st{margin-left:auto;font-size:12px;white-space:nowrap}
main{padding:14px;max-width:640px;margin:0 auto}h1,h2{font-family:Georgia,serif;margin:0 0 6px}h1{font-size:24px}h2{font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px;font-size:16px}textarea{min-height:76px}
.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:700;cursor:pointer;min-height:46px;background:var(--gb);color:var(--green);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}.btn.pri{background:var(--green);color:#fff}.btn.dan{background:var(--rb);color:var(--red)}.btn.full{width:100%}.btn:disabled{opacity:.55}.btn+.btn{margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}.row b{display:block}.grow{flex:1;min-width:0}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--gb);color:var(--green);display:grid;place-items:center;font-weight:700;flex:none}.av.lg{width:84px;height:84px;font-size:26px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 4px;cursor:pointer}.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.note{background:var(--gb);border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0}
.mrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}.mrow .nm{flex:1;min-width:0}.mrow input{width:96px;text-align:center}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px}.nav button{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;color:var(--muted);font-size:12px;cursor:pointer}.nav button.on{color:var(--green);background:var(--gb);font-weight:700}.nav i{display:block;font-style:normal;font-size:18px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}#toast.show{opacity:1}#toast.bad{background:var(--red)}
.sm{min-height:38px;padding:6px 10px;margin:0!important}.tb{border-collapse:collapse;font-size:14px}.tb th,.tb td{padding:6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.tb input{width:68px;padding:8px;text-align:center}
#pr{display:none;color:#000;background:#fff}.ph{display:flex;gap:14px;align-items:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}.ph img{width:56px;height:56px}.ph h1{color:#000;font-size:20px;margin:0}.pt{width:100%;border-collapse:collapse;font-size:12px}.pt th,.pt td{border:1px solid #444;padding:4px 6px;text-align:left}.sig{display:flex;justify-content:space-between;margin-top:60px}.sig span{border-top:1px solid #000;padding-top:4px;min-width:28%;text-align:center}
@page{size:A4;margin:14mm}@media print{body{background:#fff!important;color:#000!important;padding:0!important}body>*:not(#pr){display:none!important}#pr{display:block}}

const shrink=(f,mx=1600)=>new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const z=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*z);c.height=Math.round(im.height*z);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('Image could not be read.')),'image/jpeg',.82)};im.onerror=()=>no(new Error('That file is not a readable image.'));im.src=u});
async function saveP(){const nw=!!cur._new,f={name:$('f_name').value.trim(),guardian:$('f_guardian').value.trim(),phone:$('f_phone').value.trim(),address:$('f_address').value.trim(),dob:$('f_dob').value,gender:$('f_gender').value},cls=$('f_cls').value;
 if(cur._ph)f.photo=cur._ph;if(!f.name)return toast('Enter the student name.','bad');if(f.phone&&!/^[0-9+\s\-()]{7,16}$/.test(f.phone))return toast('Please enter a valid phone number.','bad');

 catch(x){sync('⚠ Not saved','#f0a0a8');toast(x.status==409||/duplicate/i.test(x.message)?'This student ID already exists.':'Could not save: '+x.message,'bad')}finally{busy=false}}

let DL=[];
async function stor(method,path,body,mime){await fresh();const h={apikey:SB_KEY,Authorization:'Bearer '+C.tok};if(mime)h['Content-Type']=mime;let r;try{r=await fetch(SB_URL+'/storage/v1/object/'+(method=='GET'?'authenticated/':'')+'docs/'+path.split('/').map(enc).join('/'),{method,headers:h,body})}catch(x){throw new Error('No internet connection.')}
 if(!r.ok){let m='File request failed';try{m=(await r.json()).message||m}catch(x){}throw new Error(m)}return method=='GET'?r.blob():null}
async function docLoad(){try{DL=await rest('documents?select=*&owner_id=eq.'+enc(cur.id)+'&order=updated_at.desc')}catch(x){DL=[];toast(x.message,'bad')}docDraw()}
function docDraw(){const tb=$('tb');if(!tb||tab!='docs')return;tb.innerHTML=`<div class="field"><label>Document type</label><select id="d_t">${TYPES.map(t=>`<option>${e(t)}</option>`).join('')}</select></div><div class="field"><label>Reference / note (optional)</label><input id="d_r"></div>
<label class="btn pri full" style="cursor:pointer">⬆ Choose photo or PDF and upload<input type="file" accept="image/*,application/pdf" class="hidden" onchange="docUp(this)"></label><p class="muted" style="font-size:13px">Photos are reduced automatically. PDF up to 8 MB. Uploaded documents cannot be deleted here. Ask the office to remove a wrong upload.</p>`+
 (DL.length?DL.map(d=>`<div class="row" style="cursor:default"><span class="grow"><b>${e(d.type)}</b><small class="muted">${e(d.file_name||'No file')} · ${e(d.status)}</small></span>${d.file_path?`<button class="btn sm" onclick="docView('${d.uid}')">View</button>`:''}</div>`).join(''):'<p class="muted">No documents uploaded yet.</p>')}
async function docUp(inp){const f=inp.files[0];inp.value='';if(!f)return;busy=true;sync('● Uploading…');
 try{let b=f,nm=f.name;if(f.type.startsWith('image/')){b=await shrink(f);nm=nm.replace(/\.[^.]+$/,'')+'.jpg'}if(b.size>8e6)throw new Error('File is larger than 8 MB.');
  const path=sf(cur.id)+'/'+crypto.randomUUID()+'-'+sf(nm).slice(-60);await stor('POST',path,b,b.type||'application/octet-stream');
  try{const r=await rest('documents',{method:'POST',body:{uid:crypto.randomUUID(),owner_id:cur.id,type:$('d_t').value,ref:$('d_r').value.trim(),doc_date:today(),status:'Pending',notes:'',file_path:path,file_name:nm,mime:b.type||null,size:b.size},prefer:'return=representation'});if(!r||!r.length)throw new Error('The upload was not accepted.')}catch(x){await stor('DELETE',path).catch(()=>{});throw x}
  sync('● Online','#7fe0b4');toast('Uploaded. The office can see it now.');await docLoad()}
 catch(x){sync('⚠ Not saved','#f0a0a8');toast('Could not upload: '+x.message,'bad')}finally{busy=false}}
async function docView(u){const d=DL.find(x=>x.uid==u);if(!d)return;try{const b=await stor('GET',d.file_path);window.open(URL.createObjectURL(b),'_blank')}catch(x){toast(x.message,'bad')}}

function aMon(){$('ab').innerHTML=`<div class="card"><div class="two"><div class="field"><label>Month</label><input id="a_m" type="month" value="${am.mon}" onchange="aLoad()"></div><div class="field"><label>Academic days</label><input id="a_d" type="number" min="1" max="31" value="${am.days}" oninput="am.days=this.value;aCalc()"></div></div><p class="muted" style="font-size:13px;margin:0">Academic days = days the college was open for lessons. Leave a student blank to skip.</p></div><div id="at"></div>`;aLoad()}

async function aSave(){const d=+$('a_d').value,mon=$('a_m').value;if(!mon||!(d>0&&d<=31))return toast('Enter the month and academic days (1 to 31).','bad');
 const body=[];for(const [i,el] of [...document.querySelectorAll('.ai')].entries()){const v=el.value.trim();if(v==='')continue;if(isNaN(+v)||+v<0||+v>d)return toast(`Days present must be 0 to ${d}.`,'bad');body.push({student_id:S[i].id,month:mon,days:d,present:+v})}

const pr={t:'list',mon:today().slice(0,7),yr:new Date().getFullYear(),ex:'',sid:''};
function vPrint(m){const exs=[...new Set(M.map(x=>x.exam))],t=pr.t;
 m.innerHTML=`<div class="card"><h2>Print documents</h2><div class="field"><label>What to print</label><select id="p_t" onchange="pr.t=this.value;render()">${[['list','Class student list'],['am','Attendance sheet (monthly)'],['ay','Attendance report (yearly)'],['mk','Class mark sheet'],['rc','Student report card']].map(([v,l])=>`<option value="${v}" ${t==v?'selected':''}>${l}</option>`).join('')}</select></div>
${t=='am'?`<div class="field"><label>Month</label><input id="p_m" type="month" value="${pr.mon}"></div>`:''}
${['ay','mk','rc'].includes(t)?`<div class="field"><label>Year</label><input id="p_y" type="number" value="${pr.yr}"></div>`:''}
${t=='mk'||t=='rc'?`<div class="field"><label>Exam</label><select id="p_e">${exs.map(x=>`<option ${x==pr.ex?'selected':''}>${e(x)}</option>`).join('')}</select></div>`:''}
${t=='rc'?`<div class="field"><label>Student</label><select id="p_s">${S.map(s=>`<option value="${e(s.id)}" ${s.id==pr.sid?'selected':''}>${e(s.name)} (${e(s.id)})</option>`).join('')}</select></div>`:''}
<button class="btn pri full" onclick="doPrint()">🖨 Print / Save as PDF</button><div class="note">On your phone, choose "Save as PDF" in the print window to share the file.</div></div>`}
const phd=t=>`<div class="ph"><img src="${LOGO}" alt=""><div><h1>Al-Dheeniyya Arabic College</h1><b>${e(t)}</b><br><small>Class: ${e((P.classes||[]).join(', '))} · Class teacher: ${e(P.name||P.email)} · Printed ${new Date().toLocaleDateString('en-GB')}</small></div></div>`;
const tbl=(h,R)=>`<table class="pt"><thead><tr>${h.map(x=>`<th>${e(x)}</th>`).join('')}</tr></thead><tbody>${R.map(r=>`<tr>${r.map(x=>`<td>${e(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
function sheet(ex,y){const L=M.filter(x=>x.exam==ex&&x.year==y),subs=[...new Set(L.map(x=>x.subject))];
 const R=S.map(s=>{let t=0,m=0;const c={};subs.forEach(sb=>{const r=L.find(x=>x.student_id==s.id&&x.subject==sb);if(r){c[sb]=r;if(r.marks!=null){t+=+r.marks;m+=+r.max}}});return{s,c,t,m,pc:pct(t,m)}});
 R.filter(r=>r.m).sort((a,b)=>b.pc-a.pc).forEach((r,i,a)=>r.rk=i&&a[i-1].pc==r.pc?a[i-1].rk:i+1);return{subs,R}}
const mk=r=>r?(r.marks==null?'AB':r.marks):'';
function doPrint(){const g=id=>($(id)||{}).value,t=pr.t;pr.mon=g('p_m')||pr.mon;pr.yr=+g('p_y')||pr.yr;pr.ex=g('p_e')||pr.ex;pr.sid=g('p_s')||pr.sid;let h='';
 if(t=='list')h=phd('Student list')+tbl(['No.','ID','Name','Class','Guardian','Phone','Date of birth'],S.map((s,i)=>[i+1,s.id,s.name,s.cls,s.guardian,s.phone,s.dob]));
 else if(t=='am'){const R=S.map((s,i)=>{const r=A.find(x=>x.student_id==s.id&&x.month==pr.mon);return[i+1,s.id,s.name,r?r.days:'',r?r.present:'',r?r.days-r.present:'',r?pct(r.present,r.days)+'%':'']});h=phd('Attendance, '+pr.mon)+tbl(['No.','ID','Name','Academic days','Present','Absent','%'],R)}
 else if(t=='ay'){const R=S.map((s,i)=>{const a=yrAtt(s.id,pr.yr);return[i+1,s.id,s.name,a.n,a.d,a.p,a.pc+'%']});h=phd('Attendance report, '+pr.yr)+tbl(['No.','ID','Name','Months recorded','Academic days','Present','%'],R)}
 else if(t=='mk'||t=='rc'){if(!pr.ex)return toast('No exam found. Enter marks first.','bad');const sh=sheet(pr.ex,pr.yr);if(!sh.subs.length)return toast('No marks for that exam and year.','bad');
  if(t=='mk')h=phd(`Mark sheet, ${pr.ex} ${pr.yr}`)+tbl(['No.','Name',...sh.subs.map(sb=>{const r=M.find(x=>x.exam==pr.ex&&x.year==pr.yr&&x.subject==sb);return sb+' ('+(r?r.max:'')+')'}),'Total','%','Rank'],sh.R.map((r,i)=>[i+1,r.s.name,...sh.subs.map(sb=>mk(r.c[sb])),r.m?r.t+'/'+r.m:'',r.m?r.pc+'%':'',r.rk||'']));
  else{const r=sh.R.find(x=>x.s.id==pr.sid);if(!r)return toast('Choose a student.','bad');const a=yrAtt(r.s.id,pr.yr);
   h=phd(`Report card, ${pr.ex} ${pr.yr}`)+`<p><b>${e(r.s.name)}</b> · ID ${e(r.s.id)} · Class ${e(r.s.cls)}</p>`+tbl(['Subject','Marks','Full marks','%'],sh.subs.map(sb=>{const c=r.c[sb];return[sb,mk(c),c?c.max:'',c&&c.marks!=null?pct(c.marks,c.max)+'%':'']}))+
   `<p><b>Total:</b> ${r.m?r.t+' / '+r.m:'—'} · <b>Percentage:</b> ${r.m?r.pc+'%':'—'} · <b>Rank:</b> ${r.rk||'—'} of ${sh.R.filter(x=>x.m).length}<br><b>Attendance ${pr.yr}:</b> ${a.d?`${a.p} of ${a.d} days (${a.pc}%)`:'—'}</p><div class="sig"><span>Class teacher</span><span>Principal</span><span>Guardian</span></div>`}}
 $('pr').innerHTML=h;setTimeout(()=>window.print(),50)}
$('lg').src=LOGO;render();
(async()=>{try{const a=JSON.parse(localStorage.getItem(AK)||'null');if(a&&a.ref){C.ref=a.ref;C.exp=0;setSess(await auth('token?grant_type=refresh_token',{refresh_token:a.ref}));await start()}}catch(x){C={tok:null,ref:null,exp:0,uid:null}}})();
</script></body></html>
